name: Daily Word Generation

on:
  schedule:
    # 北京时间每天 09:30 = UTC 01:30
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发（方便测试）

permissions:
  contents: write  # 需要写权限才能把生成的 words-data.json commit 回仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests cos-python-sdk-v5

      - name: Run daily word generation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          HOSTING_BUCKET: ${{ secrets.HOSTING_BUCKET }}
          HOSTING_REGION: ${{ secrets.HOSTING_REGION }}
        run: python daily_gen.py

      - name: Commit generated data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f words-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update words-data.json"
            git push
          fi
